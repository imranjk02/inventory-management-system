<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetTech - Add Sale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand-link"><h2>NetTech</h2></a>
        <a href="/dashboard">Dashboard</a>
        <a href="/courses">Courses</a>
        <a href="/trainers">Trainers</a>
        <a href="/sales" class="active">Sales</a>
        <a href="/sales-report">Reports</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="main">
        <div class="topbar">
            <h2>Add Sale</h2>
            <div class="topbar-right">
                <button id="darkModeBtn" class="dark-mode-btn">🌙</button>
                <span>Welcome, {{ username }}</span>
            </div>
        </div>

        <div class="content">
            <div class="page-heading">
                <div><h1>Add Sale</h1><p>Record a new course enrollment.</p></div>
            </div>

            <div class="form-container">
                <form method="POST" action="{{ url_for('add_sale') }}">
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="student_name" class="form-control" placeholder="Enter student name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select name="course_id" class="form-select" required>
                            <option value="">Select Course</option>
                            {% for course in courses %}
                            <option value="{{ course.id }}">{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" name="amount" class="form-control" placeholder="Enter amount" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="sale_date" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Sale</button>
                    <a href="/sales" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

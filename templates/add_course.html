<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetTech - Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand-link"><h2>NetTech</h2></a>
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/courses">Courses</a>
        <a href="/trainers">Trainers</a>
        <a href="/sales">Sales</a>
        <a href="/sales-report">Reports</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="main">
        <div class="topbar">
            <h2>Add Course</h2>
            <div class="topbar-right">
                <button id="darkModeBtn" class="dark-mode-btn">🌙</button>
                <span>Welcome, {{ username }}</span>
            </div>
        </div>

        <div class="content">
            <div class="page-heading">
                <div><h1>Add Course</h1><p>Add a new training course.</p></div>
            </div>

            <div class="section form-section">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Course Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter course name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" placeholder="Example: Development" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Trainer</label>
                            <select name="trainer_id" class="form-select" required>
                                <option value="">Select Trainer</option>
                                {% for trainer in trainers %}
                                <option value="{{ trainer.id }}">{{ trainer.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Price</label>
                            <input type="number" name="price" class="form-control" placeholder="₹" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Available Seats</label>
                            <input type="number" name="seats" class="form-control" placeholder="Seats" required>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Add Course</button>
                            <a href="/courses" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

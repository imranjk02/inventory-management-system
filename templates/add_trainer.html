<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetTech - Add Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand-link"><h2>NetTech</h2></a>
        <a href="/dashboard">Dashboard</a>
        <a href="/courses">Courses</a>
        <a href="/trainers" class="active">Trainers</a>
        <a href="/sales">Sales</a>
        <a href="/sales-report">Reports</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="main">
        <div class="topbar">
            <h2>Add Trainer</h2>
            <div class="topbar-right">
                <button id="darkModeBtn" class="dark-mode-btn">🌙</button>
                <span>Welcome, {{ username }}</span>
            </div>
        </div>

        <div class="content">
            <div class="page-heading">
                <div>
                    <h1>Add Trainer</h1>
                    <p>Add a new course trainer.</p>
                </div>
            </div>

            <div class="section form-section">
                <form action="/add-trainer" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Trainer Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter trainer name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter email">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Specialization</label>
                            <input type="text" name="specialization" class="form-control" placeholder="Example: Java">
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Add Trainer</button>
                            <a href="/trainers" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

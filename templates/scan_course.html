<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - NetTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        .header {
            background: #171720;
            color: white;
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .course-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .course-title {
            color: #6c5ce7;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .course-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .course-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #333;
            text-align: right;
        }

        .course-id {
            display: inline-block;
            background: #eee9ff;
            color: #6c5ce7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {

            .header {
                padding: 18px 20px;
                font-size: 24px;
            }

            .container {
                margin: 30px auto;
            }

            .course-card {
                padding: 25px;
            }

            .course-title {
                font-size: 26px;
            }

            .course-row {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="header">NetTech</div>
    <div class="container">
        <div class="course-card">
            <div class="course-id">Course ID: {{ course.id }}</div>
            <div class="course-title">{{ course.name }}</div>
            <div class="course-row"><span class="label">Category</span><span class="value">{{ course.category }}</span></div>
            <div class="course-row"><span class="label">Trainer</span><span class="value">{{ course.trainer }}</span></div>
            <div class="course-row"><span class="label">Price</span><span class="value">₹{{ "%.2f"|format(course.price) }}</span></div>
            <div class="course-row"><span class="label">Available Seats</span><span class="value">{{ course.seats }}</span></div>
        </div>
    </div>
</body>
</html>
